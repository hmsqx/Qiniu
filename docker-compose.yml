services:
  mysql:
    image: mysql:5.7
    container_name: qiniu-mysql
    command:
      [
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_general_ci",
      ]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-Tasks}
      MYSQL_USER: ${MYSQL_USER:-Qiniu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-Password}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./server/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-p${MYSQL_ROOT_PASSWORD:-rootpass}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - qiniu-net

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        MODEL_FS_BASE_DIR: ${MODEL_FS_BASE_DIR:-/var/www/models}
        MODEL_URL_BASE_PATH: ${MODEL_URL_BASE_PATH:-/models}
        TENCENTCLOUD_REGION: ${TENCENTCLOUD_REGION:-ap-guangzhou}
        # Optional: set to a domestic mirror, e.g. http://mirrors.aliyun.com/ubuntu
        UBUNTU_MIRROR: ${UBUNTU_MIRROR:-}
    container_name: qiniu-server
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_USER: ${MYSQL_USER:-Qiniu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-Tasks}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      TENCENTCLOUD_SECRET_ID: ${TENCENTCLOUD_SECRET_ID:-}
      TENCENTCLOUD_SECRET_KEY: ${TENCENTCLOUD_SECRET_KEY:-}
      TENCENTCLOUD_REGION: ${TENCENTCLOUD_REGION:-ap-guangzhou}
      # Seeding controls for initial model injection
      ALWAYS_SEED_MODELS: ${ALWAYS_SEED_MODELS:-0}
      SEED_OVERWRITE: ${SEED_OVERWRITE:-0}
      MODEL_FS_BASE_DIR: ${MODEL_FS_BASE_DIR:-/var/www/models}
      SEED_MODELS_DIR: ${SEED_MODELS_DIR:-/opt/seed-models}
    volumes:
      - models-data:${MODEL_FS_BASE_DIR:-/var/www/models}
      - ./seed-models:${SEED_MODELS_DIR:-/opt/seed-models}:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - qiniu-net

  py_server:
    build:
      context: ./py-server
      dockerfile: Dockerfile
    container_name: qiniu-py-server
    depends_on:
      mysql:
        condition: service_healthy
      server:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
      # Ensure settings load from packaged .env inside image
      APP_ENV_FILE: ${APP_ENV_FILE:-/app/.env}
      # API keys and models
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      QWEN_MODEL: ${QWEN_MODEL:-qwen-plus}
      QWEN_IMAGE_EDIT_MODEL: ${QWEN_IMAGE_EDIT_MODEL:-qwen-image-edit}
      # Optional endpoints and server runtime flags
      QWEN_COMPATIBLE_BASE_URL: ${QWEN_COMPATIBLE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      DASHSCOPE_BASE_HTTP_API_URL: ${DASHSCOPE_BASE_HTTP_API_URL:-https://dashscope.aliyuncs.com/api/v1}
      HOST: ${PY_HOST:-0.0.0.0}
      PORT: ${PY_PORT:-8090}
      RELOAD: ${PY_RELOAD:-true}
      LOG_LEVEL: ${PY_LOG_LEVEL:-INFO}
    volumes:
      - models-data:/var/www/models
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - qiniu-net

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        API_UPSTREAM: ${API_UPSTREAM:-http://server:8080}
        LLM_UPSTREAM: ${LLM_UPSTREAM:-http://py_server:8090}
    container_name: qiniu-web
    depends_on:
      server:
        condition: service_healthy
      py_server:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - qiniu-net

volumes:
  mysql-data:
  models-data:

networks:
  qiniu-net:
    driver: bridge
